schemaVersion: 1
id: standard
# 大模式参数入口；四子模式只定义覆盖，原子实现及候选、几何和校验工作链均在共享库中唯一维护。
parameters:
  # 普通物流塔参与枚举的布局族。all 同时考虑可用族，blackbox 仅试黑盒，field 仅试塔场。当前普通模式只生成黑盒候选，单选 field 会得到空列表。
  stationFamily: all
  # 普通配送和物流塔的短行跨度（工作格）。最多 4 个不同的有限正数，单项不超过 10000。
  standardRowSpans: [8, 12]
  # 普通配送全场候选，每行是一套组合。scale 是模块高度倍率（正数），order 是 0～3 的单元排序策略。
  # 在轮廓装箱中，0、2 优先大单元，1、3 保留输入顺序，2、3 额外计入线长。latitudeFactor 越小，纬向预算越紧，0 表示略过这项额外限高。
  # materialOrder 启用物料邻接排序。consumerFirst 仅在其为 true 时可用，优先放置消费端。
  distributorStrategies:
    - {"scale": 1, "order": 2}
    - {"scale": 1.2, "order": 3}
    - {"scale": 1, "order": 3, "latitudeFactor": 0.7}
    - {"scale": 1, "order": 3, "latitudeFactor": 0.85}
    - {"scale": 1.2, "order": 2, "latitudeFactor": 0.75}
    - {"scale": 1, "order": 3, "latitudeFactor": 0.85, "materialOrder": true}
    - {"scale": 1.2, "order": 3, "latitudeFactor": 0.7, "materialOrder": true, "consumerFirst": true}
    - {"scale": 1.2, "order": 3, "materialOrder": true}
  # 用于普通短行装箱的独立策略表。每项的 scale、order 含义同上，与 standardRowSpans 配合使用。
  distributorRowStrategies:
    - {"scale": 1.2, "order": 0}
    - {"scale": 1.2, "order": 2}
flow:
  - id: entry
    call: entry
subflows:
  entry:
    flow:
      - id: mode-defaults
        tool: mode.configure@1
        with:
          stationFamily: {$param: stationFamily}
      - id: submode
        switch:
          value: {$state: mode.family}
          cases:
            connected:
              - id: connected-parameters
                # 折行跨度继承 common.yaml 的 bentSpans。仅需本模式例外时，在此用 with 覆盖。
                tool: mode.submode@1
            station:
              - id: station-parameters
                tool: mode.submode@1
                # 塔子模式与下方枚举使用文件顶部的同一布局族。
                with: {stationFamily: {$param: stationFamily}}
            distributor:
              - id: distributor-parameters
                tool: mode.submode@1
            bus:
              - id: bus-parameters
                tool: mode.submode@1
                # 内部总线模式允许在平面基线之外追加收紧布局。
                with: {busTighten: true}
          otherwise:
            - id: unsupported-submode
              fail: unsupported-layout-family
      - id: geographic-policy
        switch:
          value: {$state: mode.geo.longitude-boundary}
          cases:
            reduced-ring:
              - id: reduced-ring-policy
                switch:
                  value: {$state: mode.geo.hemisphere}
                  cases:
                    south:
                      - id: south-ring
                        tool: mode.geography@1
                        # 南半球收缩纬圈的街道朝向尝试顺序。数字 0～3 各相差 90°。
                        with: {streetRotations: [2, 3, 0, 1]}
                  otherwise:
                    - id: north-ring-default
                      tool: mode.geography@1
          otherwise:
            - id: geographic-default
              tool: mode.geography@1
      - id: surface-workchain
        call: common/selected-surface
  # 按物流族选择工作链。standardRowPacking 启用普通行阵装箱，standardRowSpans 提供对应的候选跨度。
  layout:
    flow:
      - id: family
        switch:
          value: {$state: mode.family}
          cases:
            connected:
              - id: connected
                call: connected/search
            distributor:
              - id: distributor-specs
                tool: distributor.enumerate@1
                with:
                  standard: {$param: distributorStrategies}
                  standardRows: {$param: distributorRowStrategies}
                  standardRowSpans: {$param: standardRowSpans}
                  standardRowPacking: true
              - id: distributor
                call: distributor/search
            station:
              - id: station-specs
                call: station/enumerate
                with:
                  family: {$param: stationFamily}
                  standardRowSpans: {$param: standardRowSpans}
                  standardRowPacking: true
              - id: station
                call: station/attempts
            bus:
              - id: bus
                call: bus/search
          otherwise:
            - id: unknown-family
              fail: unsupported-layout-family
