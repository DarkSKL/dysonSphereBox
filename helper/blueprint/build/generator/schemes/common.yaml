schemaVersion: 1
id: common
# 公共默认只在此定义；覆盖顺序为注册默认→公共→大模式→子模式→地理→枚举节点with。
parameters:
  adjacentDepths: [1, 2, 3]
  allowOffsetWindows: true
  largestOffsetFirst: true
  localRectangleAspects: [1.8, 2.4, 3, 4.5, 1.5, 1.2, 0]
  compareTurnedRows: true
  primaryLayoutsPerSurface: 1
  polarWindowRows: [24, 32, 40, 48, 56, 64]
  rowSpans: [12, 18, 24, 32]
  streetGroups: [0, 2, -1]
  streetRotations: [0, 1, 2, 3]
  denseOrders: [0, 1, 2, 3]
  bentSpans: [12, 18]
toolDefaults:
  surface.enumerate@1:
    polarWindowRows: {$state: mode.polar-window-rows}
flow:
  - id: entry
    call: surface
subflows:
  selected-regions:
    flow:
      - id: describe-real-regions
        tool: geometry.describe-regions@1
      - id: each-real-region
        regions:
          items: {$state: factory.region-ids}
          flow:
            - id: actual-latitude-class
              switch:
                value: {$state: factory.region-class}
                cases:
                  planar:
                    - id: check-planar
                      tool: geometry.check-region@1
                      with: {boundarySampleLimit: 64}
                  equatorial:
                    - id: check-equatorial
                      tool: geometry.check-region@1
                      with: {boundarySampleLimit: 64}
                  temperate:
                    - id: check-temperate
                      tool: geometry.check-region@1
                      with: {boundarySampleLimit: 128}
                  polar:
                    - id: check-polar
                      tool: geometry.check-region@1
                      with: {boundarySampleLimit: 256}
                  multi-band:
                    - id: check-cross-band
                      tool: geometry.check-region@1
                      with: {boundarySampleLimit: 0}
                otherwise:
                  - id: unknown-region-class
                    fail: unverified-region-class
      - id: validate-complete-factory
        tool: factory.validate-regions@1
  surface:
    flow:
      - id: common-defaults
        tool: mode.defaults@1
        with:
          polarWindowRows: {$param: polarWindowRows}
          rowSpans: {$param: rowSpans}
          streetGroups: {$param: streetGroups}
          streetRotations: {$param: streetRotations}
          denseOrders: {$param: denseOrders}
          bentSpans: {$param: bentSpans}
      - id: major-mode
        switch:
          value: {$state: mode.density}
          cases:
            standard:
              - id: standard-entry
                call: standard/entry
            dense:
              - id: dense-entry
                call: dense/entry
          otherwise:
            - id: unsupported-density
              fail: unsupported-density
  selected-surface:
    flow:
      - id: surface-workchain
        switch:
          value: {$state: surface.strategy}
          cases:
            strict:
              - id: strict-chain
                call: common/strict
            adaptive:
              - id: adaptive-chain
                call: common/adaptive
            native:
              - id: native-chain
                call: common/native
            adjacent:
              - id: adjacent-chain
                call: common/adjacent
          otherwise:
            - id: unsupported-surface-strategy
              fail: unsupported-surface-strategy
  strict:
    flow:
      - id: strict-spec
        tool: surface.enumerate@1
        with: {strategy: strict, expandAdjacent: false, preciseFootprint: false}
      - id: strict-attempt
        call: surface-attempts
  adaptive:
    flow:
      - id: strict-spec
        tool: surface.enumerate@1
        with: {strategy: strict, expandAdjacent: false, preciseFootprint: false}
      - id: strict-or-native
        candidates:
          fallbackOn: [GEN_E_CONNECTED_PREPARATION, GEN_E_SHAPE, GEN_E_COLLISION, GEN_E_SURFACE_ROUTING, GEN_E_DENSITY_LAYOUT, GEN_E_SURFACE_CAPACITY, GEN_E_DENSITY_STREET_SEAM]
          selection: first
          parallel: 1
          items: {$state: surface.candidates}
          inputs:
            index: {type: integer, required: true}
          flow:
            - id: apply
              tool: surface.prepare@1
              with: {index: {$input: index}}
            - id: layout
              call: layout
          fallback:
            - id: native-fallback
              call: native
  native:
    flow:
      - id: native-specs
        tool: surface.enumerate@1
        with: {strategy: native, expandAdjacent: false, preciseFootprint: false, includeBandFallback: true}
      - id: native-or-precise
        candidates:
          fallbackOn: [GEN_E_CONNECTED_PREPARATION, GEN_E_SHAPE, GEN_E_COLLISION, GEN_E_SURFACE_ROUTING, GEN_E_DENSITY_LAYOUT, GEN_E_SURFACE_CAPACITY, GEN_E_DENSITY_STREET_SEAM]
          selection: first
          parallel: 1
          items: {$state: surface.candidates}
          inputs:
            index: {type: integer, required: true}
          flow:
            - id: apply
              tool: surface.prepare@1
              with: {index: {$input: index}}
            - id: layout
              call: layout
          fallback:
            - id: precise-specs
              tool: surface.enumerate@1
              with: {strategy: native, expandAdjacent: false, preciseFootprint: true, includeBandFallback: true}
            - id: precise-attempts
              call: surface-attempts
  adjacent:
    flow:
      - id: prefer-single-band
        candidates:
          selection: first
          parallel: 1
          # 先在原选区内寻找完整合格工厂；只有有界尝试未成功才进入实际许可的相邻纬带。
          items: [{alternative: strict}, {alternative: adjacent}]
          inputs:
            alternative: {type: string, required: true}
          flow:
            - id: alternative
              switch:
                value: {$input: alternative}
                cases:
                  adjacent:
                    - id: expanded
                      call: expanded
                  strict:
                    - id: single-band-attempt
                      candidates:
                        selection: first
                        parallel: 1
                        timeoutMs: 20000
                        timeoutFailure: GEN_E_SURFACE_CAPACITY
                        items: [{}]
                        flow:
                          - id: strict-or-native
                            call: adaptive
                otherwise:
                  - id: unknown-alternative
                    fail: unknown-surface-alternative
  expanded:
    flow:
      - id: adjacent-specs
        tool: surface.enumerate@1
        with:
          strategy: native
          expandAdjacent: true
          preciseFootprint: false
          includeBandFallback: false
          adjacentDepths: {$param: adjacentDepths}
          allowOffsetWindows: {$param: allowOffsetWindows}
          largestOffsetFirst: {$param: largestOffsetFirst}
          localRectangleAspects: {$param: localRectangleAspects}
          compareTurnedRows: {$param: compareTurnedRows}
      - id: plan-search-passes
        tool: search.plan-passes@1
        with: {primary: {$param: primaryLayoutsPerSurface}}
      - id: surface-search-order
        call: expanded-fair
  expanded-fair:
    flow:
      - id: primary-then-remaining
        candidates:
          selection: first
          parallel: 1
          # 先给每个表面一个主布局机会；第二轮从1开始，不重跑第一轮。
          items: {$state: search.surface-passes}
          inputs:
            start: {type: integer, required: true}
            limit: {type: integer, required: true}
          flow:
            - id: configure-layout-window
              tool: search.window@1
              with: {start: {$input: start}, limit: {$input: limit}}
            - id: visit-each-surface
              call: expanded-attempts
  expanded-attempts:
    flow:
      - id: adjacent-attempts
        candidates:
          selection: first
          parallel: 1
          # 单带已先行尝试；跨带使用任务剩余预算，保留20秒用于汇合与编码，总任务截止不延长。
          reserveMs: 20000
          timeoutFailure: GEN_E_SURFACE_CAPACITY
          items: {$state: surface.candidates}
          inputs:
            index: {type: integer, required: true}
          flow:
            - id: apply
              tool: surface.prepare@1
              with: {index: {$input: index}}
            - id: layout
              call: layout
  surface-attempts:
    flow:
      - id: candidates
        candidates:
          selection: first
          parallel: 1
          items: {$state: surface.candidates}
          inputs:
            index: {type: integer, required: true}
          flow:
            - id: apply
              tool: surface.prepare@1
              with: {index: {$input: index}}
            - id: layout
              call: layout
  layout:
    flow:
      - id: major-mode-layout
        switch:
          value: {$state: mode.density}
          cases:
            standard:
              - id: standard-layout
                call: standard/layout
            dense:
              - id: dense-layout
                call: dense/layout
          otherwise:
            - id: unsupported-density
              fail: unsupported-density
      - id: validate-shape
        tool: factory.check-shape@1
