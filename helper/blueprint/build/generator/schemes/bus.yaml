schemaVersion: 1
id: bus
# 纯共享工作库：入口参数与工作链选择归standard/dense，此处只复用唯一候选、几何及规则步骤。
flow:
  - id: entry
    call: search
subflows:
  search:
    flow:
      - id: bus-specs
        tool: bus.enumerate@1
        with: {tighten: {$state: mode.bus-tighten}}
      - id: bus-window
        tool: bus.window@1
      - id: bus-attempts
        candidates:
          comparator: layout
          parallel: 1
          items: {$state: bus.candidates}
          inputs:
            index: {type: integer, required: true}
          flow:
            - id: solve
              tool: bus.assemble@1
              with: {index: {$input: index}}
            - id: finalize-geometry
              call: geometry/finalize
            - id: validate
              call: rules/validate
      - id: select-final
        tool: factory.select@1
