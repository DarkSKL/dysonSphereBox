<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        #app { width: 100%; height: 100%; }

</head>
<body>
    <div id="app"></div>

    <!-- 浏览器环境 polyfill -->

    <!-- 依赖：Vue 3 和 vue-i18n（必须在库之前加载） -->

    <script src="https://unpkg.com/vue-i18n@9.9/dist/vue-i18n.global.prod.js"></script>

    <!-- JS 库 -->
    <script src="./dsp-blueprint-editor.umd.js"></script>

    <script>

        const app = DSPBlueprintEditor.createBlueprintApp({
            container: '#app',
            theme: 'dark',

        // 等待 Vue 渲染完成后注入蓝图
        setTimeout(() => {

            if (textarea) {

                nativeSetter.call(textarea, BP);
                textarea.dispatchEvent(new Event('change', { bubbles: true }));

        }, 300);
