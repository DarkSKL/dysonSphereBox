<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlueprintViewer Demo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0d1117; color: #e6edf3; font-family: sans-serif; }
        #canvas { width: 100%; height: calc(100vh - 60px); }
        .toolbar {
            height: 60px; display: flex; align-items: center; gap: 12px;
            padding: 0 16px; background: #161b22; border-bottom: 1px solid #30363d;
        }
        .toolbar textarea {
            flex: 1; height: 36px; padding: 6px 10px; font-size: 12px;
            background: #0d1117; color: #e6edf3; border: 1px solid #30363d;
            border-radius: 6px; resize: none; font-family: monospace;
        }
        .toolbar button {
            padding: 8px 16px; background: #58a6ff; color: #fff; border: none;
            border-radius: 6px; cursor: pointer; font-size: 13px; white-space: nowrap;
        }
        .toolbar button:hover { background: #79b8ff; }
        .toolbar button:disabled { background: #30363d; color: #8b949e; cursor: not-allowed; }
        #info { font-size: 12px; color: #8b949e; }
    </style>
</head>
<body>
    <div class="toolbar">
        <textarea id="bpInput" placeholder="粘贴蓝图字符串后点击加载...">BLUEPRINT:1,10,1000,0,0,0,0,0,639179103143818253,0.10.34.28529,%E6%96%B0%E8%93%9D%E5%9B%BE,222,,,11111"H4sIAAAAAAAACo3TPUvDQBgH8OeapG9WLRqEuigIdnARqh1ETGMGwcHBL+AgBEEHddFJ6ujmagnYueAgbS3YpYJ76SA4+NLJwdVR6HmXe4tSDh8Ilxz5Pf/kLokBgEUOBKxGyGHwcwQYoMqnDciSsYIxpte9xByACdXSCcYO6uTuNqCxDtySezBSLcOqsDkBSxIaHMY0MCagAWUJjzkEDTRUYkfCR1wPYVwDzUiiI+AMT7Q00FIQZOI0h0gD4wJa0JfwgMOkBiYEpCVgYZtBUwOTkUd1nwcEHvqtRZ6Y0sCUgllXJH7zVU1rYFptx6yE7zcMYl4wBNKvEidd9smFK0ngRXBbjCBe6BfMCEj3sZa/btF3/JM2FI4qmHVF4n/gGBlfEwss8esTOw9XU/cBLni1TXs1sDtFOv/0suMczU+2AZY8v3u2XPqoexm+XQizH482RpHG46IxXQP7jTTwJ9qX3fPifm6v2TO31nbJvAg87Qcr5UHd8/ONJm0QLqDspxqH4w+XI3VIBAQAAA=="E9B37543C95350168D17A753CF8AE399</textarea>
        <button id="loadBtn">加载蓝图</button>
        <button id="resetBtn">重置视角</button>
        <span id="info"></span>
    </div>
    <div id="canvas"></div>

    <script>window.process = { env: { NODE_ENV: 'production' } };</script>
    <script src="https://unpkg.com/vue@3.4/dist/vue.global.prod.js"></script>
    <script src="https://unpkg.com/vue-i18n@9.9/dist/vue-i18n.global.prod.js"></script>
    <script src="./lib/dsp-blueprint-editor.js"></script>

    <script>
        const { BlueprintViewer, parseBlueprint } = DSPBlueprintEditor;

        // 创建纯 3D 预览器（不依赖 Vue）
        const viewer = new BlueprintViewer({
            container: '#canvas',
            theme: 'dark',
        });

        const info = document.getElementById('info');
        const bpInput = document.getElementById('bpInput');

        // 加载蓝图
        function load() {
            const str = bpInput.value.trim();
            if (!str) return;
            try {
                viewer.loadBlueprint(str);
                const data = parseBlueprint(str);
                info.textContent = `${data.header.shortDesc} | ${data.buildings.length} 个建筑`;
            } catch (e) {
                info.textContent = '解析失败: ' + e.message;
            }
        }

        // 按钮事件
        document.getElementById('loadBtn').onclick = load;
        document.getElementById('resetBtn').onclick = () => viewer.resetCamera();

        // 页面加载时自动渲染
        load();
    </script>
</body>
</html>
